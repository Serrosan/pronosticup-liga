services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - 'storage-app:/var/www/html/storage/app/public'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
    networks:
      - coolify
volumes:
  storage-app:
    driver: local
networks:
  coolify:
    external: true