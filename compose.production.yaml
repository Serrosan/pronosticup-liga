services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "80"
    volumes:
      - 'storage-app:/var/www/html/storage/app/public'
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
volumes:
  storage-app:
    driver: local
networks:
  coolify:
    external: true