# Cabeceras de seguridad de PronostiCup.
# Se incluye en el server y en cada location que tenga su propio add_header:
# en nginx, un add_header dentro de un location ANULA los del server.
#
# - HSTS: el navegador solo usará HTTPS durante un año (sin includeSubDomains,
#   para no afectar a otros subdominios).
# - X-Frame-Options: nadie puede meter la app dentro de un iframe de otra web
#   (el frame-ancestors del index.html no vale en una etiqueta meta).
# - nosniff: el navegador no adivina tipos de fichero.
# - Referrer-Policy: a otras webs solo les llega el dominio, no la ruta.
# - Permissions-Policy: micrófono solo para la propia app (notas de voz del
#   chat); cámara, ubicación, pagos y USB, desactivados.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
