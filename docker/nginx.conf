server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # No anunciar la versión de nginx.
    server_tokens off;
    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    client_max_body_size 20M;

    # Medida provisional (CVE-2026-109618/109619): los envíos con archivos
    # (multipart) solo pasan a PHP si vienen de la propia app, que siempre manda
    # la cabecera X-XSRF-TOKEN. Frena los ataques automáticos masivos.
    set $multipart_ajeno "";
    if ($content_type ~* "multipart/form-data") { set $multipart_ajeno "M"; }
    if ($http_x_xsrf_token = "") { set $multipart_ajeno "${multipart_ajeno}S"; }
    if ($multipart_ajeno = "MS") { return 403; }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Ningún otro .php se ejecuta (ni uno subido por error o por un atacante).
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}