; Ajustes de seguridad de PHP para PronostiCup.
; - session.upload_progress: medida provisional de la alerta CVE-2026-109618/109619.
;   Laravel no usa las sesiones nativas de PHP, así que apagarlo no rompe nada.
; - session.use_strict_mode: recomendado por PHP para cualquier web.
; - expose_php: no anunciar la versión de PHP en las cabeceras.
session.upload_progress.enabled = 0
session.use_strict_mode = 1
expose_php = Off
